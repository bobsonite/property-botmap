        zoom: 16
    });

    const listDiv = document.getElementById('list');
    const markers = {};

    buildings.forEach((b, index) => {
        // Create Sidebar Item
        const item = document.createElement('div');
        item.className = 'item';
        item.innerHTML = `<strong>${b.name}</strong><span>${b.university_id}</span>`;
        item.onclick = () => {
            map.flyTo({ center: [b.long, b.lat], zoom: 19 });
        };
        listDiv.appendChild(item);

        // Create Draggable Marker
        const marker = new mapboxgl.Marker({ draggable: true, color: '#ff0000' })
            .setLngLat([b.long, b.lat])
            .setPopup(new mapboxgl.Popup().setText(b.name))
            .addTo(map);

        marker.on('dragend', () => {
            const lngLat = marker.getLngLat();
            buildings[index].long = parseFloat(lngLat.lng.toFixed(5));
            buildings[index].lat = parseFloat(lngLat.lat.toFixed(5));
        });

        markers[b.building_id] = marker;
    });

    function generateCode() {
        const json = JSON.stringify(buildings, null, 4);
        // Format it as JS variable
        const code = `const GOLDEN_BUILDINGS = ${json};`;
        document.getElementById('output').value = code;
